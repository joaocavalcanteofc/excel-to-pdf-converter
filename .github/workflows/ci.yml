name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-lock.txt

      - name: Run tests
        run: python -m pytest

      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements-lock.txt

      - name: Validate PyInstaller build
        if: matrix.python-version == '3.14'
        run: python -m PyInstaller --noconfirm "Excel converter.spec"
